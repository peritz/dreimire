[project]
name = "dreimire"
version = "0.1.0"
description = "Personal financial Flask application - Dreimire (meaning ladder) - for keeping on top of my finances"
readme = "README.md"
authors = [
    { name = "peritz", email = "peritz@pardonmynoot.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
]
